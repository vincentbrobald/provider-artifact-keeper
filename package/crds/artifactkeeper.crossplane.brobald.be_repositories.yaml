---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: repositories.artifactkeeper.crossplane.brobald.be
spec:
  group: artifactkeeper.crossplane.brobald.be
  names:
    categories:
    - crossplane
    - managed
    - artifactkeeper
    kind: Repository
    listKind: RepositoryList
    plural: repositories
    singular: repository
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .metadata.annotations.crossplane\.io/external-name
      name: KEY
      type: string
    - jsonPath: .spec.forProvider.format
      name: FORMAT
      type: string
    - jsonPath: .spec.forProvider.type
      name: TYPE
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          A Repository is an Artifact Keeper repository. Deleting it deletes the
          repository and its packages: leave Delete out of managementPolicies for
          one that matters.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: RepositorySpec defines the desired state of a Repository.
            properties:
              forProvider:
                description: |-
                  RepositoryParameters are what Artifact Keeper's repository should be. Its
                  key (the path segment clients use: /maven/<key>, /npm/<key>, ...) is the
                  external name, by default the object's name.
                properties:
                  description:
                    description: Free text shown with the repository; empty clears
                      it.
                    type: string
                  format:
                    description: |-
                      Package format: maven, npm, pypi, generic, ... (Artifact Keeper's
                      names). Can't change.
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: format can't change
                      rule: self == oldSelf
                  members:
                    description: |-
                      Members of a virtual repository, in priority order (the first is
                      searched first): a Repository object of this namespace (repositoryRef)
                      or any repository's key.
                    items:
                      description: RepositoryMember is one member of a virtual repository.
                      properties:
                        key:
                          description: |-
                            A repository's key (any repository, including ones no Repository
                            object manages).
                          type: string
                        repositoryRef:
                          description: A Repository object of this namespace.
                          properties:
                            name:
                              type: string
                          required:
                          - name
                          type: object
                      type: object
                      x-kubernetes-validations:
                      - message: exactly one of repositoryRef and key
                        rule: has(self.repositoryRef) != has(self.key)
                    type: array
                  name:
                    description: Display name; the key when empty.
                    type: string
                  public:
                    description: Anonymous read access (allow_anonymous_access). Default
                      false.
                    type: boolean
                  quotaBytes:
                    description: |-
                      Storage quota in bytes. Unset: no quota at creation, and an existing
                      quota is left as it is (removing the field doesn't remove a quota).
                    format: int64
                    type: integer
                  type:
                    description: |-
                      local (hosted), remote (pull-through cache of upstreamURL) or virtual
                      (the members, in order). Can't change.
                    enum:
                    - local
                    - remote
                    - virtual
                    type: string
                    x-kubernetes-validations:
                    - message: type can't change
                      rule: self == oldSelf
                  upstreamURL:
                    description: |-
                      The upstream registry of a remote repository. Can't change (the API
                      has no update for it).
                    type: string
                    x-kubernetes-validations:
                    - message: upstreamURL can't change
                      rule: self == oldSelf
                required:
                - format
                - type
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            description: RepositoryStatus represents the observed state of a Repository.
            properties:
              atProvider:
                description: |-
                  RepositoryObservation is what Artifact Keeper reports about the
                  repository.
                properties:
                  format:
                    description: Its package format.
                    type: string
                  id:
                    description: The repository's ID (references from permissions
                      and tokens use it).
                    type: string
                  members:
                    description: A virtual repository's member keys, in priority order.
                    items:
                      type: string
                    type: array
                  storageUsedBytes:
                    description: Bytes its packages take.
                    format: int64
                    type: integer
                  type:
                    description: local, remote or virtual.
                    type: string
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
