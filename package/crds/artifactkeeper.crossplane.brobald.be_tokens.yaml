---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: tokens.artifactkeeper.crossplane.brobald.be
spec:
  group: artifactkeeper.crossplane.brobald.be
  names:
    categories:
    - crossplane
    - managed
    - artifactkeeper
    kind: Token
    listKind: TokenList
    plural: tokens
    singular: token
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.atProvider.prefix
      name: PREFIX
      type: string
    - jsonPath: .status.atProvider.expiresAt
      name: EXPIRES
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: A Token is an API token of a ServiceAccount.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TokenSpec defines the desired state of a Token.
            properties:
              forProvider:
                description: |-
                  TokenParameters are an API token of a service account, published in the
                  connection Secret (key token; the account's user name in key username).
                  The external name is the token's ID. Artifact Keeper shows a token's value
                  only when it is made, so a token is never adopted: without an external
                  name, a token of the same name is revoked and a new one made. A change of
                  scopes or repositories, or the token's expiry, revokes it and makes a new
                  one; a change of name or expiresInDays applies only to the next token.
                properties:
                  expiresInDays:
                    description: Days until the token expires; Artifact Keeper's policy
                      when unset.
                    format: int64
                    type: integer
                  name:
                    description: The token's name in Artifact Keeper, unique per service
                      account.
                    minLength: 1
                    type: string
                  repositoryKeys:
                    description: |-
                      Keys of repositories to restrict the token to (any repository,
                      including ones no Repository object manages).
                    items:
                      type: string
                    type: array
                  repositoryRefs:
                    description: |-
                      Restricts the token to these repositories (Repository objects of this
                      namespace, or keys); every repository the account may use when both
                      are empty.
                    items:
                      description: LocalReference names an object of the same namespace.
                      properties:
                        name:
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                  scopes:
                    description: Scopes, e.g. read:artifacts, write:artifacts.
                    items:
                      type: string
                    minItems: 1
                    type: array
                  serviceAccountRef:
                    description: The ServiceAccount object (this namespace) the token
                      belongs to.
                    properties:
                      name:
                        type: string
                    required:
                    - name
                    type: object
                required:
                - name
                - scopes
                - serviceAccountRef
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            description: TokenStatus represents the observed state of a Token.
            properties:
              atProvider:
                description: |-
                  TokenObservation is what Artifact Keeper reports about the token (never
                  its value).
                properties:
                  expiresAt:
                    description: When the token expires; empty if it doesn't.
                    type: string
                  id:
                    description: The token's ID (also the external name).
                    type: string
                  prefix:
                    description: The token's first characters, to recognise it.
                    type: string
                  repositoryIds:
                    description: The IDs of the repositories it is restricted to.
                    items:
                      type: string
                    type: array
                  scopes:
                    description: Its scopes.
                    items:
                      type: string
                    type: array
                  serviceAccountId:
                    description: |-
                      The ID of the service account it belongs to, kept so that the token
                      can be revoked after the ServiceAccount object is gone.
                    type: string
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
