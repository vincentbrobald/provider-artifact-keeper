---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: oidcproviders.artifactkeeper.crossplane.brobald.be
spec:
  group: artifactkeeper.crossplane.brobald.be
  names:
    categories:
    - crossplane
    - managed
    - artifactkeeper
    kind: OIDCProvider
    listKind: OIDCProviderList
    plural: oidcproviders
    singular: oidcprovider
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .spec.forProvider.issuerURL
      name: ISSUER
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          An OIDCProvider is a login of Artifact Keeper through an OIDC IdP
          (Keycloak).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OIDCProviderSpec defines the desired state of an OIDCProvider.
            properties:
              forProvider:
                description: |-
                  OIDCProviderParameters: an OIDC login of Artifact Keeper. The external
                  name is its ID, found by name when empty.
                properties:
                  adminGroup:
                    description: Members of this IdP group are admins.
                    type: string
                  autoCreateUsers:
                    description: Create users at their first login. Default true.
                    type: boolean
                  clientID:
                    minLength: 1
                    type: string
                  clientSecretSecretRef:
                    description: |-
                      The client's secret (Artifact Keeper never shows it back: a change of
                      the Secret is noticed by its hash, status.atProvider.clientSecretHash).
                    properties:
                      key:
                        type: string
                      name:
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  enabled:
                    description: Default true.
                    type: boolean
                  groupsClaim:
                    description: Claim with the user's groups. Default groups.
                    type: string
                  issuerURL:
                    minLength: 1
                    type: string
                  mapGroupsToGroups:
                    description: |-
                      Mirror the groups claim as Artifact Keeper groups (created on first
                      sight, memberships reconciled at each login). Default true.
                    type: boolean
                  name:
                    description: |-
                      The name shown on the login page; also how an existing provider is
                      found.
                    minLength: 1
                    type: string
                  pkce:
                    description: Default true.
                    type: boolean
                  redirectURI:
                    description: |-
                      The URL the IdP sends users back to; Artifact Keeper derives it from
                      the request when empty (.../api/v1/auth/sso/oidc/callback).
                    type: string
                  scopes:
                    description: Default openid, profile, email.
                    items:
                      type: string
                    type: array
                  usernameClaim:
                    description: Claim with the user name. Default preferred_username.
                    type: string
                required:
                - clientID
                - clientSecretSecretRef
                - issuerURL
                - name
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            description: OIDCProviderStatus represents the observed state of an OIDCProvider.
            properties:
              atProvider:
                description: 'OIDCProviderObservation: what Artifact Keeper reports.'
                properties:
                  clientSecretHash:
                    description: SHA-256 of the client secret last sent.
                    type: string
                  id:
                    type: string
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
